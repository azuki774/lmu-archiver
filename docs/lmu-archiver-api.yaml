# LMU Archiver API

Read-only JSON from SQLite. Default URL: `http://127.0.0.1:8080`.
One SQLite file stores one Steam account, registered by the first successful sync.
Imports for another Steam ID fail; use separate SQLite files for other accounts.
There is no authentication, TLS, or CORS support.

## Endpoints

| GET path | Query | Result |
| --- | --- | --- |
| `/api/v1/races` | `limit`: positive integer, default 10; `offset`: non-negative integer, default 0; optional `from`, `to`, `track`, `class`, `event-type` | Race events with the account's race results, newest first |
| `/api/v1/ratings` | `limit=N`: positive integer | Latest N stored rating-change observations, oldest first |
| `/api/v1/ratings` | `from`, `to`: date or RFC3339 string | Observations in `[from, to)`, oldest first |
| `/api/v1/stats/tracks` | optional `from`, `to`, `track`, `class`, `event-type` | Per-track aggregation over every matching race, most races first |
| `/api/v1/filters` | none | Distinct `tracks`, `classes`, and `eventTypes` the race filters can match |

Without `limit`, ratings default to the last 30 days; dates mean midnight UTC.
For ratings, do not combine `limit` with `from`/`to` (400). An empty `limit` means 10.
Race filters combine with AND. `from` is inclusive, `to` is exclusive, and
either may be omitted; races have no default date range. Dates are `YYYY-MM-DD`
(midnight UTC) or RFC3339; malformed dates or equal/reversed bounds return 400.
`track`, `class`, and `event-type` are exact, case-sensitive values matching the
event track, the account's participation car class, and the event type. Unknown
values return `[]`, and empty parameters are ignored. Filters apply before
`limit`; full sessions and `referenceRating` are not date-filtered. See
[race filters](../README.md#race-filters) for encoding timezone offsets.
Races apply filters, then `event_at DESC, event_id DESC` ordering, then
`offset` and `limit` to events, not session rows. Empty `offset` means 0; invalid
or overflowing numbers return 400. An offset at or beyond the end returns `[]`.
Pages are independent reads and may shift during sync; see
[race pagination](../README.md#race-pagination).
`/api/v1/stats/tracks` uses the same filters as races and aggregates every
matching race session (`session_type='race'`), never one list page. `races`
counts distinct events and `starts` race session blocks. `overall` aggregates
`position` and `class` aggregates `class_position`; the two ranking kinds are
reported separately and never blended. Rows with a null `position` (null
`class_position` for class stats) count toward `starts` but never join that
ranking's averages or best positions; `finish_status` is not consulted.
`wins` and `podiums` are plain counts. `avgPosition` and `bestPosition` are
`null` when no positioned result exists. `bestLapUs` is the fastest race lap
on the track, or `null` when no race lap time exists. Rows are ordered by
`races` descending, then track name.
`/api/v1/filters` returns the distinct values the race filters can match,
each as a sorted array; only events with the account's own race sessions
contribute, so every offered value can produce matches. Both endpoints return
the account's data without account selection.
`/api/v1/races`, `/api/v1/ratings`, and `/api/v1/stats/tracks` return arrays;
no matches returns `[]`. `/api/v1/filters` returns one object whose fields are
`[]` when nothing matches. Missing values use `null`.
The initial rating observation counts as a point; unchanged checks add no point.

## Main response fields

| Response | Field | JSON type |
| --- | --- | --- |
| Race | `event`, `participation` | object |
| Race | `results` | array of session-result objects |
| Race | `referenceRating` | rating object or null |
| Rating | `observedAt` | string (UTC RFC3339) |
| Rating | `drElo`, `srRating` | number |
| TrackStats | `track` | string |
| TrackStats | `races`, `starts` | integer |
| TrackStats | `overall`, `class` | position-stats object |
| PositionStats | `wins`, `podiums` | integer |
| PositionStats | `avgPosition`, `bestPosition` | number or null, integer or null |
| TrackStats | `bestLapUs` | integer microseconds or null |
| Filters | `tracks`, `classes`, `eventTypes` | arrays of strings |

`referenceRating` is the latest observation at/before the event, not a confirmed
post-race rating. Session durations ending in `Us` are integer microseconds.
See [Go response types](../internal/storage/types.go) for the complete fields.

## Examples

Examples show selected fields; actual responses contain additional fields.

`GET /api/v1/races?limit=1`

```json
[{
  "event": {"eventId":"race-1","eventAt":"2026-10-01T12:00:00Z","title":"Example race"},
  "results": [{"sessionType":"race","position":2}],
  "referenceRating": null
}]
```

`GET /api/v1/ratings?limit=2`

```json
[
  {"observedAt":"2026-10-02T00:00:00Z","drElo":1500.25,"srRating":4.25},
  {"observedAt":"2026-10-03T00:00:00Z","drElo":1510.25,"srRating":4.5}
]
```

`GET /api/v1/stats/tracks?class=GT3`

```json
[{
  "track": "Le Mans",
  "races": 2,
  "starts": 3,
  "overall": {"wins": 1, "podiums": 2, "avgPosition": 3.5, "bestPosition": 1},
  "class": {"wins": 2, "podiums": 3, "avgPosition": 1.5, "bestPosition": 1},
  "bestLapUs": 218350000
}]
```

`GET /api/v1/filters`

```json
{"tracks": ["Le Mans", "Monza"], "classes": ["GT3"], "eventTypes": ["daily", "specialevent"]}
```

Errors use `{"error":"message"}`: 400 invalid query, 404 unknown path,
405 unsupported method, 500 query/encoding failure.
